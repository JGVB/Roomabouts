add_radar:
  name: Add radar
  description: Add a Home Assistant entity-backed radar. Requires an administrator.
  fields:
    radar_name:
      name: Radar name
      description: Base name used by the radar's Home Assistant entities.
      required: true
      selector:
        text:
    map_group:
      name: Map
      description: Map or floor that contains the radar.
      required: false
      default: default
      selector:
        text:

remove_radar:
  name: Remove radar
  description: Remove a radar and its saved layout. Requires an administrator.
  fields:
    radar_name:
      name: Radar name
      required: true
      selector:
        text:

set_radar_pause:
  name: Set radar pause
  description: Pause or resume one entity-backed radar. Requires an administrator.
  fields:
    radar_name:
      name: Radar name
      required: true
      selector:
        text:
    paused:
      name: Paused
      required: true
      selector:
        boolean:

update_radar_zone:
  name: Update zone
  description: Update saved map or radar-local geometry. No hardware command is sent. Requires an administrator.
  fields:
    radar_name:
      name: Radar name
      description: Required for radar-local zones; omit for map zones.
      required: false
      selector:
        text:
    zone_type:
      name: Zone type
      required: true
      selector:
        select:
          options:
            - monitor_zones
            - hw_detect_zones
            - hw_block_zones
            - hw_stay_zones
            - include_zones
            - exclude_zones
            - entrance_zones
            - stationary_zones
    points:
      name: Zones or polygon points
      description: A polygon or a list of bounded zone objects.
      required: true
      selector:
        object:
    map_group:
      name: Map
      required: false
      default: default
      selector:
        text:

update_radar_layout:
  name: Update radar layout
  description: Update allowlisted radar placement and geometry. Requires an administrator.
  fields:
    radar_name:
      name: Radar name
      required: true
      selector:
        text:
    layout:
      name: Layout
      description: Placement values such as origin, scale, rotation, and mounting height.
      required: true
      selector:
        object:
    map_group:
      name: Map
      required: false
      selector:
        text:
    zones:
      name: Radar-local zones
      required: false
      selector:
        object:

generate_radar_config:
  name: Recalculate map
  description: Recalculate the current in-memory map from Home Assistant entity state. Requires an administrator.

update_map_config:
  name: Update map settings
  description: Update bounded map and tracking settings. Requires an administrator.
  fields:
    map_group:
      name: Map
      required: true
      selector:
        text:
    update_interval:
      name: Update interval
      required: false
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          unit_of_measurement: s
    merge_distance:
      name: Merge distance
      required: false
      selector:
        number:
          min: 0.01
          max: 20.0
          step: 0.01
    target_height:
      name: Target height
      required: false
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: m

import_config:
  name: Import configuration
  description: Replace saved configuration from bounded, allowlisted JSON. Credentials, network destinations, and runtime targets are rejected. Requires an administrator.
  fields:
    config_json:
      name: Configuration JSON
      required: true
      selector:
        text:
          multiline: true

reset_tracking_history:
  name: Reset tracking history
  description: Reset ephemeral tracking state without writing runtime coordinates to storage. Requires an administrator.

name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Contract and deterministic checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14.3'
          check-latest: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.6.9
          cache: false

      - name: Verify pinned toolchain
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 14, 3), sys.version'
          deno eval 'if (Deno.version.deno !== "2.6.9") throw new Error(Deno.version.deno)'

      - name: Compile Python
        run: python -m compileall -q custom_components/radar_map_manager tests/python

      - name: Run release contract
        run: python -m unittest discover -s tests/python -p 'test_*.py'

      - name: Check JavaScript modules
        run: deno check --no-config custom_components/radar_map_manager/www/*.js tests/js/*.js

      - name: Run JavaScript tests
        run: deno test --no-config tests/js

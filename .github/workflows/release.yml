name: Release

on:
  release:
    types: [published] # 只在正式发布时触发，避免与 created / edited 产生并发冲突

permissions:
  contents: read

# 确保同一个 Release 不会同时跑多个上传任务
concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  release:
    name: Upload Release Asset
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Zip custom_components
        run: |
          cd custom_components/radar_map_manager
          zip -r ../../radar_map_manager.zip .

      - name: Upload Zip to Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: radar_map_manager.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
